# Build the escript, publish it as a GitHub release, then install it from that
# release on Linux and macOS to prove the published file works.
#
# Trigger from the Actions tab ("Release" → "Run workflow"), or from a terminal:
#   gh workflow run release.yml
#   gh workflow run release.yml -f prerelease=true
#   gh run watch
#
# The version comes from mix.exs. Bump it there before releasing; an existing
# tag fails the run instead of overwriting a published release.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Build on the oldest supported OTP. A newer OTP runs older BEAM files, not
  # the other way round, so this widens where the escript runs.
  OTP_VERSION: "26.2"
  ELIXIR_VERSION: "1.17.3"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Read the version from mix.exs
        id: version
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)".*/\1/p' mix.exs | head -1)
          [ -n "$version" ] || { echo "::error::could not read version from mix.exs"; exit 1; }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; bump version in mix.exs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

      - name: Build the escript
        run: mix escript.build
        env:
          MIX_ENV: prod

      - name: Check the escript runs
        run: |
          ./jurisdictional help | grep -q "client for the Jurisdictional HTTP API" \
            || { echo "::error::escript did not print its usage"; exit 1; }
          sha256sum jurisdictional > jurisdictional.sha256
          cat jurisdictional.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: jurisdictional
          path: |
            jurisdictional
            jurisdictional.sha256
            install.sh
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jurisdictional

      - name: Create the release
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA" --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" jurisdictional jurisdictional.sha256 install.sh \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          # Confirm all three files are attached, not just that the call returned.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort | tr '\n' ' ')
          echo "assets: $assets"
          [ "$assets" = "install.sh jurisdictional jurisdictional.sha256 " ] \
            || { echo "::error::release assets are incomplete: $assets"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}

  verify-install:
    needs: [build, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: erlef/setup-beam@v1
        if: runner.os == 'Linux'
        with:
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install Erlang
        if: runner.os == 'macOS'
        run: brew install erlang

      - name: Install from the published release
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            | JURISDICTIONAL_VERSION="$TAG" JURISDICTIONAL_INSTALL_DIR="$RUNNER_TEMP/bin" sh
        env:
          TAG: ${{ needs.build.outputs.tag }}

      - name: Run a public lookup
        run: |
          "$RUNNER_TEMP/bin/jurisdictional" --json juricode "Vacaville, CA" > out.json
          grep -q '"jurisdictions"' out.json \
            || { echo "::error::juricode did not return jurisdictions"; cat out.json; exit 1; }
