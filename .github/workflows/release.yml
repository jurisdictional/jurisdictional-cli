# Build and publish a jurisdictional-cli release, then install it from that
# release on clean machines to prove the published files work.
#
# Trigger from the Actions tab ("Release" → "Run workflow"), or from a terminal:
#   gh workflow run release.yml
#   gh workflow run release.yml -f prerelease=true
#   gh run watch
#
# The version comes from mix.exs. Bump it there before releasing; an existing
# tag fails the run instead of overwriting a published release.
#
# Assets:
#   jurisdictional-<target>.tar.gz  mix release with its own Erlang runtime
#   install.sh                      picks the right file, checks SHA256SUMS, confirms it runs
#   juricode-workflow.yml           example GitHub Actions workflow
#   SHA256SUMS                      checksums for every file above
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The bundled release carries its own runtime, so it can use a current OTP.
  OTP_VERSION: "28"
  ELIXIR_VERSION: "1.19"

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from mix.exs
        id: version
        run: |
          version=$(sed -nE 's/^[[:space:]]*version: "([^"]+)".*/\1/p' mix.exs | head -1)
          [ -n "$version" ] || { echo "::error::could not read version from mix.exs"; exit 1; }
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; bump version in mix.exs"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
        env:
          GH_TOKEN: ${{ github.token }}

      # Tests run on the current OTP: test-only deps (cowlib, via bypass) need OTP 27+.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix test

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu we target, so it runs on glibc 2.35+ with OpenSSL 3.
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: linux-arm64
            os: ubuntu-22.04-arm
          # setup-beam's macOS builds link OpenSSL statically.
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - run: mix deps.get
        env:
          MIX_ENV: prod

      - name: Build the release
        run: mix release --overwrite
        env:
          MIX_ENV: prod

      - name: Stage the tarball
        run: |
          mkdir -p stage
          cp -R _build/prod/rel/jurisdictional_cli stage/jurisdictional
          mkdir -p stage/jurisdictional/examples
          cp examples/juricode-workflow.yml stage/jurisdictional/examples/
          tar -czf "jurisdictional-${{ matrix.target }}.tar.gz" -C stage jurisdictional
          ls -la "jurisdictional-${{ matrix.target }}.tar.gz"

      - name: Check crypto links only to system libraries
        run: |
          nif=$(ls stage/jurisdictional/lib/crypto-*/priv/lib/crypto.so)
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L "$nif"
            if otool -L "$nif" | tail -n +2 | grep -Ev '^[[:space:]]*/(usr/lib|System)/'; then
              echo "::error::crypto.so links outside the system; the tarball would not be portable"
              exit 1
            fi
          else
            ldd "$nif"
            if ldd "$nif" | grep -q "not found"; then
              echo "::error::crypto.so has a missing library"
              exit 1
            fi
          fi

      # The release starts its own erts-*/bin/erl, never one on PATH.
      # The debian job in verify-install proves it on a machine with no Erlang at all.
      - name: Run it with setup-beam's Erlang off PATH
        run: |
          bin="$PWD/stage/jurisdictional/bin/jurisdictional"
          # shellcheck disable=SC2016 # the inner shell expands these
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '
            "$0" help | grep -q "client for the Jurisdictional HTTP API"
            "$0" --json juricode "Vacaville, CA" | grep -q "\"jurisdictions\""
          ' "$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: jurisdictional-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [test, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Add the installer, the example, and checksums
        run: |
          cp install.sh dist/
          cp examples/juricode-workflow.yml dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Create the release
        run: |
          flags=(--generate-notes --target "$GITHUB_SHA" --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

          # Confirm every file is attached, not just that the call returned.
          # shellcheck disable=SC2012 # dist holds only our own asset names
          expected=$(ls dist | sort | tr '\n' ' ')
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort | tr '\n' ' ')
          echo "expected: $expected"
          echo "attached: $attached"
          [ "$expected" = "$attached" ] || { echo "::error::release assets are incomplete"; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.test.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}

  verify-install:
    needs: [test, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install from the published release
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            | JURISDICTIONAL_VERSION="$TAG" sh
        env:
          TAG: ${{ needs.test.outputs.tag }}

      - name: Confirm the bundled build was installed
        run: |
          target=$(readlink "$HOME/.local/bin/jurisdictional" || true)
          echo "jurisdictional -> $target"
          case "$target" in
            */.local/share/jurisdictional/bin/jurisdictional) ;;
            *) echo "::error::expected a link into the bundled release, got '$target'"; exit 1 ;;
          esac

      - name: Run the example workflow's lookup
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '
            status=0
            "$HOME/.local/bin/jurisdictional" --json juricode "Vacaville, CA" > juricode.json || status=$?
            if [ "$status" -ne 0 ]; then echo "juricode exited with $status"; cat juricode.json; exit "$status"; fi
            grep -q "\"jurisdictions\"" juricode.json
          '

  # A clean distro with no Erlang at all: the acceptance check for issue #1.
  verify-install-debian:
    needs: [test, publish]
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install curl
        run: apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null

      - name: Confirm this machine has no Erlang
        run: |
          if command -v erl || command -v elixir; then echo "::error::Erlang is installed; this job should prove the opposite"; exit 1; fi

      - name: Install from the published release
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            | JURISDICTIONAL_VERSION="$TAG" sh
        env:
          TAG: ${{ needs.test.outputs.tag }}

      - name: Confirm the bundled build was installed
        run: |
          target=$(readlink "$HOME/.local/bin/jurisdictional" || true)
          echo "jurisdictional -> $target"
          case "$target" in
            */.local/share/jurisdictional/bin/jurisdictional) ;;
            *) echo "::error::expected a link into the bundled release, got '$target'"; exit 1 ;;
          esac

      - name: Run the example workflow's lookup
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          env -i HOME="$HOME" PATH=/usr/bin:/bin sh -c '
            status=0
            "$HOME/.local/bin/jurisdictional" --json juricode "Vacaville, CA" > juricode.json || status=$?
            if [ "$status" -ne 0 ]; then echo "juricode exited with $status"; cat juricode.json; exit "$status"; fi
            grep -q "\"jurisdictions\"" juricode.json
          '
